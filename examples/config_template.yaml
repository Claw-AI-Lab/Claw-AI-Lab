project:
  name: "__PROJECT_ID__"
  mode: "full-auto"

research:
  topic: "__TOPIC__"
  domains:
    - "deep-learning"
  daily_paper_count: 5
  quality_threshold: 3.0
  reference_papers: __REFERENCE_PAPERS__

notifications:
  channel: "console"
  on_stage_start: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_message: false
  use_memory: false
  use_web_fetch: false

llm:
  provider: "openai-compatible"
  base_url: "your-api-endpoint" # Recommended api provider, such as https://api.vectorengine.ai/ & http://www.longcatcloud.com/
  api_key: "your-api-key"
  api_key_env: "RESEARCHCLAW_API_KEY"
  primary_model: "gpt-5.4"
  coding_model: "gpt-5.4"
  image_model: "gemini-3-pro-image-preview"
  image_base_url: ""   # Optional: separate API endpoint for image generation; falls back to base_url if empty
  image_api_key: ""    # Optional: separate API key for image generation; falls back to api_key if empty
  fallback_models:
    - "qwen3.5-plus"
    - "qwen-plus"

security:
  hitl_required_stages: []

experiment:
  mode: "sandbox"
  time_budget_sec: 2400
  max_iterations: 3
  metric_key: "primary_metric"
  metric_direction: "minimize"
  datasets_dir: ""
  checkpoints_dir: ""
  codebases_dir: ""
  shared_results_dir: "runs/shared_results"
  paper_length: "long"
  sandbox:
    python_path: "__PYTHON_PATH__"
  sanity_check_max_iterations: 100

runtime:
  timezone: "Asia/Shanghai"

web_search:
  enabled: true
  # exa_api_key_env: "EXA_API_KEY"    # Exa AI search (https://exa.ai)
  # exa_search_type: "auto"            # auto | neural | fast
  # tavily_api_key_env: "TAVILY_API_KEY"

prompts:
  custom_file: ""
